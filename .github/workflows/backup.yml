name: Backup

# Weekly encrypted export of accounts, nicknames, leaderboards and reminder subscriptions, kept as a
# workflow artifact for 90 days. Artifacts of a public repository can be downloaded by others, so the
# backup is always encrypted with BACKUP_PASSPHRASE (scrypt + AES-256-GCM) and the job refuses to run
# without it. Restore with: BACKUP_PASSPHRASE=... npm run restore -- <file>.json.enc --yes
#
# Repository secrets: KV_REST_API_URL, KV_REST_API_TOKEN (copy from Vercel) and BACKUP_PASSPHRASE.

on:
  schedule:
    - cron: '0 21 * * 0' # Sundays, 02:30 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: check
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$KV_REST_API_URL" ] || [ -z "$KV_REST_API_TOKEN" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::notice::Backup secrets are not set (KV_REST_API_URL, KV_REST_API_TOKEN, BACKUP_PASSPHRASE), so the backup is skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - if: steps.check.outputs.skip != 'true'
        run: npm ci
      - if: steps.check.outputs.skip != 'true'
        name: Export (encrypted)
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: npm run backup
      - if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: messed-up-backup-${{ github.run_number }}
          path: backups/*.json.enc
          retention-days: 90
          if-no-files-found: error
